[workspace]
members = [
    "psy-precompiles",
    "psy-fmt",
    "psy-lsp-server",
    "psy-wasm",
    "psy-parser",
    "psy-ast",
    "psy-sema",
    "psy-lexer",
    "psy-interpreter",
    "psy-package",
    "psy-dargo-cli",
    "psy-abi",
    "psy-common",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.86"
version = "0.1.0"
homepage = "https://psy.xyz"
repository = "https://github.com/PsyProtocol/psy-compiler"

[workspace.lints]

[workspace.dependencies]
zstd = { version = "0.13", features = ["zstdmt"] }
# Remote qedlang/psy-prover deps (active): parth-generic-v1 git rev
psy_vm = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_vm", default-features = false }
psy_crypto = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_crypto" }
psy_data = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_client_data", default-features = false }
psy_common_core = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_client_common" }
psy_config = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_config" }
psy_prover = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_prover", default-features = false }
psy_common_circuit = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_common_circuit", default-features = false }
psy_dpn_circuit = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_dpn_circuit", default-features = false }
psy_ups_circuit = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_ups_circuit", default-features = false }
psy_network_circuit = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "psy_network_circuit", default-features = false }
kvq = { git = "ssh://git@192.168.1.76:2222/cj/parth-generic-v1.git", rev = "0b09d88adab73685015ce76d75cf6038cbb0ab64", package = "kvq" }

# Local compiler packages
psy_common = { package = "psy_compiler_common", path = "./psy-common" }
psy-ast = { path = "./psy-ast" }
psy-fmt = { path = "./psy-fmt" }
psy-lsp-server = { path = "./psy-lsp-server" }
psy-parser = { path = "./psy-parser" }
psy-sema = { path = "./psy-sema" }
psy-lexer = { path = "./psy-lexer" }
psy-interpreter = { path = "./psy-interpreter" }
psy-package = { path = "./psy-package" }
dargo = { path = "./psy-dargo-cli" }
psy-abi = { path = "./psy-abi" }
psy-precompiles = { path = "./psy-precompiles", default-features = false}

# Common dependencies
colored = "2"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.4.0", features = ["hex"] }
serde_repr = "0.1.19"
hex = "0.4.3"
hex-literal = "0.4.1"
lazy_static = "1.4.0"
once_cell = "1.19.0"
twox-hash = "1.6.3"
async-recursion = "1.0"
hashbrown = "0.14.5"
anyhow = "1.0.75"
async-trait = { version = "0.1.88" }
base64 = "0.22"
bitcoin = { version = "0.31.1", features = ["serde", "rand"] }
chrono = "0.4.39"
homedir = "0.3"

rand = "0.8.5"
rand_core = "0.9"
rand_pcg = "0.9"
getrandom = { version = "0.2", features = ["js"] }
rayon = { version = "1.10.0" }
bincode = "=1.3.3"
serde_cbor = { version = "0.11.2" }

tracing = "0.1.40"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.17", features = [
    "std",
    "env-filter",
    "json",
    "chrono",
] }
itertools = "0.14"

bytes = "1"
byteorder = "1.5"
derive_more = { version = "2", default-features = false, features = ["full"] }
indexmap = { version = "2.9", features = ["serde"] }
parking_lot = { version = "0.12", features = ["nightly"] }
smallvec = "1.15"
thiserror = "2.0"
dashmap = "6.1"
cc = "1.2"
bindgen = "0.71"

clap = { version = "4.5.39", features = ["derive", "env"] }
k256 = { version = "0.13.2", features = [
  "arithmetic",
  "ecdsa",
  "pkcs8",
  "precomputed-tables",
  "schnorr",
  "signature",
  "std",
  "serde",
] }

sha2 = "0.10.8"
sha3 = "0.10.8"

repl-rs = "0.2.8"

num = { version = "0.4.0", default-features = false }
minijinja = { version = "2.0", features = ["serde"] }
unroll = "0.1.5"
postcard = { version = "1.0.0", default-features = false, features = ["alloc"] }

bitflags = "2.5.0"

ripemd = "0.1.3"
log = { version = "0.4.14", default-features = false }
env_logger = { version = "0.11", default-features = false }
dotenvy = "0.15.0"

tokio = { version = "1.47.0", features = ["rt", "macros", "sync"] }
tokio-util = "0.7"

futures = "0.3.0"
redis = { version = "0.30.0", default-features = false, features = [
    "acl",
    "keep-alive",
    "script",
    "tokio-comp",
    "connection-manager",
    "r2d2"
] }
bb8-redis = "0.22.0"
bb8 = "0.9"
fred = "10.0.4"

criterion = "0.5"
pprof = "0.14"
tempfile = "3.19"

miette = { version = "7.2", features = ["fancy"] }
dotenv = "0.15"

smol_str = { version = "=0.3.2",  features = ["serde"] }
thin-vec = "0.2"
id-arena = "2.2"
unescaper = "0.1"
derivative = "2.2"

petgraph = "0.7"
rangemap = "1.4"
chalk = "0.1"
ena = "0.14"
unicode-segmentation = "1.12"

syn = { version = "2.0", features = ["full"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"

uuid = { version = "1.0", features = ["serde", "v4", "js"] }
http = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-logger = "0.2"
wasm-tracing = "2.0"

num-traits = "0.2"
num-bigint = { version = "0.4" }
num-integer = { version = "0.1", default-features = false }
ruint = { version = "1.12", default-features = false, features = [
  "serde",
  "num-bigint",
] }
clap_complete = "4.5"
color-eyre = "0.6"

enum-as-inner = "0.6"
strum = { version = "0.27", features = ["derive"] }

plonky2 = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934" }
plonky2_maybe_rayon = { git = "https://github.com/PsyProtocol/plonky2-hwa", rev = "1dfe6112c3eca3668c15820755371a8a3e75f934", default-features = false }

tracing-appender = "0.2"

blake2 = { version = "0.10", default-features = false }
blake3 = { version = "1.5", default-features = false }
tiny-keccak = { version = "2.0", features = ["sha3", "keccak"] }

lalrpop-util = { version = "0.22", features = ["lexer", "unicode"] }
lalrpop = "0.22"

walkdir = "2.5"
insta = { version = "1.40", features = ["glob"] }
home = { version = "0.5" }

tower-lsp = "0.20"
lsp-server = "0.7"
lsp-types = "0.97"

nom = "8.0"
logos = "0.15"
ariadne = { version = "0.5.0", features = ["auto-color"] }

either = "1"
llvm-sys = "191.0"
melior = { version = "0.21", features = ["ods-dialects"] }
mlir-sys = { version = "0.4" }

envy = "0.4"
regex = "1.11"
toml = "0.8"
url = "2.5"
dirs = "6.0"
semver = "1.0"
md5 = "0.7"
config = "0.15"

serial_test = "3.2"
shadow-rs = "0.27.1"
bs58 = { version = "0.5.1", features = ["std", "check"] }
strum_macros = "0.27"
sodalite = "0.4.0"
secp256k1 = { version = "0.31", features = ["rand", "hashes"] }
rpassword = "7.3"
ecdsa = "0.16.0"

[profile.release]
debug = false
