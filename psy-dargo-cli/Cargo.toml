clap.workspace = true
clap_complete = { workspace = true }
anyhow.workspace = true
tokio = { workspace = true }
color-eyre = { workspace = true }
serde.workspace = true
serde_json.workspace = true

psy-package.workspace = true
psy-interpreter.workspace = true
psy_vm.workspace = true
plonky2 = { workspace = true }
psy_crypto = { workspace = true }
psy_data = { workspace = true, default-features = false }
psy_common = { workspace = true }
psy_config = { workspace = true }
psy_common_circuit = { workspace = true }
